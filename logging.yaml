version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(asctime)s %(levelname)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: detailed
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    encoding: utf-8

loggers:
  cofre_api:
    handlers:
      - console
      - file
    propagate: false

root:
  level: WARNING
  handlers:
    - console